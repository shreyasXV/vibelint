<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A78BFA;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A78BFA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C4B5FD;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Shield shape -->
  <path d="M15 20 L50 8 L85 20 L85 55 Q85 75 50 90 Q15 75 15 55 Z" fill="url(#grad1)" />
  
  <!-- Checkmark inside shield -->
  <polyline points="33,50 45,63 67,35" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Magnifying glass overlay (small, bottom-right of shield) -->
  <circle cx="72" cy="68" r="10" fill="none" stroke="white" stroke-width="2.5" opacity="0.85"/>
  <line x1="79" y1="75" x2="86" y2="82" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
  
  <!-- "VibeLint" text -->
  <text x="105" y="62" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="700" fill="#1E1B4B">
    <tspan fill="#7C3AED">Vibe</tspan><tspan fill="#374151">Lint</tspan>
  </text>
  
  <!-- Tagline -->
  <text x="107" y="82" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#6B7280" letter-spacing="0.5">
    AI Code Audit
  </text>
</svg>
